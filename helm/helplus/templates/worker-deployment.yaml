{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helplus.fullname" . }}-worker
  labels:
    {{- include "helplus.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # one whatsapp session per company, so never more than one worker
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helplus.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "helplus.workerSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helplus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.migration.enabled }}
      # don't record messages against an old schema during an upgrade
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: {{ include "helplus.fullname" . }}
            - secretRef:
                name: {{ include "helplus.secretName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "worker:prod"]
          envFrom:
            - configMapRef:
                name: {{ include "helplus.fullname" . }}
            - secretRef:
                name: {{ include "helplus.secretName" . }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: whatsapp-auth
              mountPath: /app/.wwebjs_auth
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: whatsapp-auth
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "helplus.fullname" . }}-whatsapp-auth
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "helplus.fullname" . }}-storage
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
